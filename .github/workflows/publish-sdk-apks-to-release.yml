name: Retired legacy SDK APK publisher (disabled)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to append assets to (must be explicitly selected)
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: false # Replaced by publish-multiarch-release.yml; this legacy job used a stale run ID and the old release tag.
    runs-on: ubuntu-24.04
    steps:
      - name: Download successful SDK matrix artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p downloads dist
          gh run download 46135506876 --repo "${GITHUB_REPOSITORY}" \
            --pattern 'openrung-openwrt-25.12-*' --dir downloads
          find downloads -type f -name '*.apk' -exec cp -v {} dist/ \;
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 6
          (cd dist && sha256sum *.apk > SHA256SUMS-ARM-MATRIX.txt)
          ls -lh dist

      - name: Append APKs to existing formal Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release upload openwrt-packages dist/*.apk dist/SHA256SUMS-ARM-MATRIX.txt \
            --repo "${GITHUB_REPOSITORY}"
