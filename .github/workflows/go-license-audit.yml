
name: OpenRung Go Dependency License Audit

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Exact OpenRung upstream commit to audit"
        required: false
        type: string
        default: "5cba4f0b9da642dcc9cc1904f861eb1d59c23a04"

  workflow_run:
    workflows: ["Build OpenRung OpenWrt IPK"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Download successful build artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: openrung-openwrt-ipk
          path: artifacts/ipk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve exact upstream commit
        shell: bash
        env:
          INPUT_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            python3 - <<'PY' >> "$GITHUB_ENV"
          import io
          import pathlib
          import re
          import tarfile

          found = set()

          for ipk in pathlib.Path("artifacts/ipk").rglob("*.ipk"):
              with tarfile.open(ipk, "r:gz") as outer:
                  blob = outer.extractfile("./data.tar.gz")
                  if blob is None:
                      continue

                  with tarfile.open(
                      fileobj=io.BytesIO(blob.read()),
                      mode="r:gz"
                  ) as data:
                      for member in data.getmembers():
                          if member.isfile() and member.name.endswith("/SOURCE-INFO.txt"):
                              raw = data.extractfile(member).read().decode(
                                  "utf-8", "replace"
                              )
                              match = re.search(
                                  r"Exact upstream source commit:\s*([0-9a-f]{40})",
                                  raw
                              )
                              if match:
                                  found.add(match.group(1))

          if len(found) != 1:
              raise SystemExit(
                  f"Expected exactly one upstream commit; found: {sorted(found)}"
              )

          print("UPSTREAM_COMMIT=" + next(iter(found)))
          PY
          else
            REF="$(printf '%s' "${INPUT_REF:-5cba4f0b9da642dcc9cc1904f861eb1d59c23a04}" | xargs)"
            test -n "$REF"

            git init upstream
            git -C upstream remote add origin https://github.com/openrung/openrung.git
            git -C upstream fetch --depth 1 origin "$REF"

            COMMIT="$(git -C upstream rev-parse FETCH_HEAD)"
            echo "UPSTREAM_COMMIT=$COMMIT" >> "$GITHUB_ENV"
          fi

      - name: Checkout exact OpenRung upstream source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d upstream/.git ]; then
            git init upstream
            git -C upstream remote add origin https://github.com/openrung/openrung.git
          fi

          git -C upstream fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"

          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test -s upstream/go.mod
          test -s upstream/go.sum
          test -s upstream/LICENSE
          test -s upstream/THIRD_PARTY_NOTICES.md

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - name: Install pinned go-licenses
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/google/go-licenses/v2@v2.0.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Audit exact Linux amd64 client dependencies
        working-directory: upstream
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOFLAGS: "-tags=with_utls,with_external_windivert"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../license-audit

          go version | tee ../license-audit/go-version.txt
          printf '%s\n' "$UPSTREAM_COMMIT" \
            > ../license-audit/upstream-commit.txt

          echo "===== Compiled Go packages ====="

          go list -mod=readonly -deps \
            -f '{{if not .Standard}}{{.ImportPath}}{{end}}' \
            ./cmd/client |
            sed '/^$/d' |
            sort -u \
            > ../license-audit/compiled-go-packages.txt

          echo "===== Go module graph ====="

          go list -mod=readonly -m all \
            > ../license-audit/go-module-graph.txt

          # These exact modules are documented in the upstream
          # THIRD_PARTY_NOTICES.md as GPL-3.0-or-later.
          # They are separately audited below because their module
          # source trees do not expose license files to go-licenses.

          IGNORE_MODULES=(
            github.com/anytls/sing-anytls
            github.com/sagernet/fswatch
            github.com/sagernet/sing-box
            github.com/sagernet/sing
            github.com/sagernet/sing-mux
            github.com/sagernet/sing-shadowsocks
            github.com/sagernet/sing-shadowsocks2
            github.com/sagernet/sing-shadowtls
            github.com/sagernet/sing-snell
            github.com/sagernet/sing-tun
            github.com/sagernet/sing-vmess
          )

          IGNORE_ARGS=()

          for module in "${IGNORE_MODULES[@]}"; do
            IGNORE_ARGS+=( "--ignore=${module}" )
          done

          echo "===== go-licenses report ====="

          go-licenses report \
            "${IGNORE_ARGS[@]}" \
            ./cmd/client \
            > ../license-audit/go-licenses.csv \
            2> ../license-audit/go-licenses-report.log

          test -s ../license-audit/go-licenses.csv

          echo "===== Check remaining dependencies ====="

          go-licenses check \
            "${IGNORE_ARGS[@]}" \
            --disallowed_types=forbidden,unknown \
            ./cmd/client

          echo "===== Save remaining license files ====="

          go-licenses save \
            "${IGNORE_ARGS[@]}" \
            ./cmd/client \
            --save_path=../license-audit/license-files

          echo "===== Verify manually documented GPL dependencies ====="

          cp LICENSE ../license-audit/OPENRUNG-LICENSE.txt

          cp THIRD_PARTY_NOTICES.md \
            ../license-audit/OPENRUNG-THIRD-PARTY-NOTICES.md
          cp ../LICENSE-AUDIT/fswatch-v0.1.2-LICENSE.txt \
            ../license-audit/fswatch-v0.1.2-LICENSE.txt

          python3 - <<'PY'
          import csv
          import pathlib
          import sys

          root = pathlib.Path(".")
          output = pathlib.Path("../license-audit")

          notices = (root / "THIRD_PARTY_NOTICES.md").read_text(
              encoding="utf-8"
          ).lower()

          license_text = (root / "LICENSE").read_text(
              encoding="utf-8"
          )

          if "gnu general public license" not in license_text.lower():
              raise SystemExit("FAIL: upstream LICENSE is not recognized as GPL.")

          if "version 3" not in license_text.lower():
              raise SystemExit("FAIL: GPL version 3 text was not verified.")

          if "same gpl-3.0-or-later terms" not in notices:
              raise SystemExit(
                  "FAIL: upstream third-party notices do not confirm "
                  "the GPL-3.0-or-later terms for these modules."
              )

          modules = [
              "github.com/anytls/sing-anytls",
              "github.com/sagernet/fswatch",
              "github.com/sagernet/sing-box",
              "github.com/sagernet/sing",
              "github.com/sagernet/sing-mux",
              "github.com/sagernet/sing-shadowsocks",
              "github.com/sagernet/sing-shadowsocks2",
              "github.com/sagernet/sing-shadowtls",
              "github.com/sagernet/sing-snell",
              "github.com/sagernet/sing-tun",
              "github.com/sagernet/sing-vmess",
          ]

          graph = pathlib.Path(
              "../license-audit/go-module-graph.txt"
          ).read_text(encoding="utf-8")

          graph_versions = {}

          for line in graph.splitlines():
              fields = line.split()
              if len(fields) >= 2:
                  graph_versions[fields[0].lower()] = fields[1]

          manual_report = output / "manual-gpl-dependencies.csv"

          with manual_report.open(
              "w", encoding="utf-8", newline=""
          ) as file:
              writer = csv.writer(file)
              writer.writerow([
                  "module",
                  "version",
                  "license",
                  "evidence"
              ])

              for module in modules:
                  normalized = module.lower()

                  if normalized not in graph_versions:
                      raise SystemExit(
                          f"FAIL: module missing from exact Go module graph: {module}"
                      )

                  # The upstream notice writes the SagerNet family as
                  # github.com/sagernet/sing followed by abbreviated paths
                  # such as "…/fswatch", rather than repeating the full
                  # module path for every member.
                  short_name = normalized.rsplit("/", 1)[-1]
                  documented = (
                      normalized in notices
                      or f"…/{short_name}" in notices
                      or f".../{short_name}" in notices
                  )

                  if not documented:
                      raise SystemExit(
                          f"FAIL: module not documented in upstream notices: {module}"
                      )

                  if module == "github.com/sagernet/fswatch":
                      expected_version = "v0.1.2"
                      actual_version = graph_versions[normalized]
                      if actual_version != expected_version:
                          raise SystemExit(
                              "FAIL: fswatch version mismatch: "
                              f"expected {expected_version}, got {actual_version}"
                          )

                      fswatch_license = pathlib.Path(
                          "../LICENSE-AUDIT/fswatch-v0.1.2-LICENSE.txt"
                      ).read_text(encoding="utf-8")

                      fswatch_lower = fswatch_license.lower()
                      required_license_markers = [
                          "copyright (c) 2022 by nekohasekai",
                          "gnu general public license",
                          "either version 3",
                          "any later version",
                      ]
                      missing = [
                          marker for marker in required_license_markers
                          if marker not in fswatch_lower
                      ]
                      if missing:
                          raise SystemExit(
                              "FAIL: fswatch upstream license evidence is "
                              f"incomplete: {missing}"
                          )

                      evidence = (
                          "Official SagerNet/fswatch v0.1.2 LICENSE; "
                          "local verified copy at "
                          "LICENSE-AUDIT/fswatch-v0.1.2-LICENSE.txt"
                      )
                  else:
                      evidence = (
                          "Upstream THIRD_PARTY_NOTICES.md section 1 "
                          "and upstream LICENSE"
                      )

                  writer.writerow([
                      module,
                      graph_versions[normalized],
                      "GPL-3.0-or-later",
                      evidence
                  ])

          rows = list(
              csv.reader(
                  (output / "go-licenses.csv").open(
                      encoding="utf-8",
                      newline=""
                  )
              )
          )

          if not rows:
              raise SystemExit("FAIL: go-licenses report is empty.")

          unknown = [
              row for row in rows
              if row and row[-1].strip().lower() == "unknown"
          ]

          if unknown:
              raise SystemExit(
                  f"FAIL: unknown license entries remain: {len(unknown)}"
              )

          print("PASS: GPL dependency declarations verified.")
          print(f"PASS: {len(modules)} manually documented GPL modules.")
          print(f"PASS: {len(rows)} remaining go-licenses report rows.")
          PY

      - name: Write audit scope and limitations
        if: always()
        shell: bash
        run: |
          mkdir -p license-audit

          cat > license-audit/README.txt <<EOF
          OpenRung Go Dependency License Audit

          Upstream commit: ${UPSTREAM_COMMIT:-unresolved}
          Build target: ./cmd/client
          GOOS=linux
          GOARCH=amd64
          CGO_ENABLED=0
          Build tags: with_utls,with_external_windivert

          License scanner:
          github.com/google/go-licenses/v2 v2.0.1

          go-licenses.csv:
          License report for dependencies scanned by go-licenses.

          manual-gpl-dependencies.csv:
          Exact GPL-3.0-or-later modules documented in the upstream
          THIRD_PARTY_NOTICES.md and verified against the exact Go module graph.

          OPENRUNG-LICENSE.txt:
          Exact upstream LICENSE file.

          OPENRUNG-THIRD-PARTY-NOTICES.md:
          Exact upstream third-party notices.

          fswatch-v0.1.2-LICENSE.txt:
          Exact fswatch v0.1.2 upstream GPL-3.0-or-later license text,
          copied into this repository as supplemental audit evidence.

          compiled-go-packages.txt:
          Non-standard Go packages selected by the target and build tags.

          go-module-graph.txt:
          Exact Go module graph.

          license-files/:
          License files collected by go-licenses for the remaining dependencies.

          Forbidden and unknown license types remain blocked for dependencies
          scanned by go-licenses.

          GPL modules listed in manual-gpl-dependencies.csv are not silently
          treated as permissive licenses. They are explicitly recorded as
          GPL-3.0-or-later and require corresponding source and notice review.

          This automated audit does not replace human review of copyright,
          additional terms, patent, trademark, native code, assembly code,
          generated assets, or complete corresponding source.
          EOF

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrung-go-license-audit-${{ github.run_id }}
          path: license-audit/
          if-no-files-found: warn
          retention-days: 90
