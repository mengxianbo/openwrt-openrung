name: 将正式版说明更新为中文

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chinese-release-description.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate-release:
    runs-on: ubuntu-24.04
    steps:
      - name: 将现有正式版标题和说明改为中文
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          # OpenRung OpenWrt 软件包

          本正式版集中提供 OpenWrt 路由器使用的安装包。请根据设备的处理器架构和系统包管理器选择对应文件。

          ## 下载说明

          - **OpenWrt 25.12（APK 包管理器）**：下载对应架构的 APK 安装包。
          - **旧版 OpenWrt（opkg 包管理器）**：下载 IPK 安装包。
          - **ZIP 合集**：可下载对应系统版本的安装包合集。
          - **SHA256 校验文件**：下载后请核对文件校验值，确认文件完整。

          ## 当前提供的架构

          - **x86_64**：原有正式版安装包。
          - **ARM64（armsr/armv8）**：OpenWrt 25.12 APK。
          - **ARMv7（armsr/armv7）**：OpenWrt 25.12 APK。
          - **MIPS 小端（ramips/mt7621）**：OpenWrt 25.12 APK。

          ## 安装前须知

          1. APK 与 IPK 格式不能混用，请先确认设备使用的是 `apk` 还是 `opkg`。
          2. 处理器架构必须与安装包名称对应；不能仅凭设备型号判断，请在路由器执行 `uname -m` 查看。
          3. 不同 OpenWrt 版本、目标平台及衍生固件的依赖和 ABI 可能不同。即使处理器架构相同，也不代表安装包一定兼容。
          4. 多架构安装包已通过对应 SDK 构建及安装包内容检查；仍建议先备份配置，并在目标设备上实际安装验证。
          5. 请勿将 Android 手机上的 APK 安装程序用于安装这些 OpenWrt 软件包。

          ## 校验与源码

          发布附件中包含 SHA256 校验文件、版权及第三方许可证说明。对应源码归档请根据安装包内的 `SOURCE-INFO.txt` 核对准确提交版本，不要使用不匹配的源码快照替代。

          ## 反馈问题

          如遇到安装或运行问题，请提交设备型号、OpenWrt 版本、`uname -m` 输出、包管理器类型及相关日志，便于排查。
          EOF

          gh release edit openwrt-packages \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpenRung OpenWrt 软件包（APK + IPK）" \
            --notes-file release-notes.md
