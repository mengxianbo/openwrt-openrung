name: 发布多架构 OpenWrt 统一正式版（独立 Release）

on:
  workflow_run:
    workflows:
      - Build installable OpenWrt 25.12 APK matrix
      - Build installable OpenWrt 24.10 IPK matrix
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apk_matrix_run_id:
        description: 成功的 OpenWrt 25.12 APK 矩阵运行 ID
        required: true
        type: string
      ipk_matrix_run_id:
        description: 成功的 OpenWrt 24.10 IPK 矩阵运行 ID
        required: true
        type: string
      publish_confirm:
        description: 输入 PUBLISH-MULTIARCH 才允许创建独立正式 Release
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: openrung-multiarch-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_confirm == 'PUBLISH-MULTIARCH') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact packaging revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate both successful matrix runs for the same commit
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          APK_RUN_INPUT: ${{ inputs.apk_matrix_run_id }}
          IPK_RUN_INPUT: ${{ inputs.ipk_matrix_run_id }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if gh release view openwrt-packages-multiarch --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "The separate multi-architecture Release already exists; refusing to overwrite it."
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            APK_RUN_ID="$APK_RUN_INPUT"
            IPK_RUN_ID="$IPK_RUN_INPUT"
            [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid APK run ID" >&2; exit 1; }
            [[ "$IPK_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid IPK run ID" >&2; exit 1; }
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" > runs.json
            APK_RUN_ID="$(jq -r --arg sha "$TRIGGER_SHA" '[.workflow_runs[] | select(.head_branch == "main" and .head_sha == $sha and .conclusion == "success" and (.path | endswith("build-sdk-matrix.yml")))] | sort_by(.created_at) | last | .id // empty' runs.json)"
            IPK_RUN_ID="$(jq -r --arg sha "$TRIGGER_SHA" '[.workflow_runs[] | select(.head_branch == "main" and .head_sha == $sha and .conclusion == "success" and (.path | endswith("build-ipk-matrix.yml")))] | sort_by(.created_at) | last | .id // empty' runs.json)"
            if [ -z "$APK_RUN_ID" ] || [ -z "$IPK_RUN_ID" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "The other SDK matrix has not completed successfully for $TRIGGER_SHA; the next workflow completion will retry publication."
              exit 0
            fi
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_RUN_ID" > apk-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IPK_RUN_ID" > ipk-run.json
          APK_SHA="$(jq -r '.head_sha' apk-run.json)"
          IPK_SHA="$(jq -r '.head_sha' ipk-run.json)"
          jq -e '.conclusion == "success" and (.path | endswith("build-sdk-matrix.yml"))' apk-run.json >/dev/null
          jq -e '.conclusion == "success" and (.path | endswith("build-ipk-matrix.yml"))' ipk-run.json >/dev/null
          test "$APK_SHA" = "$IPK_SHA" || { echo "APK/IPK matrix runs used different source commits" >&2; exit 1; }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$APK_SHA" = "$TRIGGER_SHA" || { echo "Manual release runs do not match this checkout" >&2; exit 1; }
          else
            test "$APK_SHA" = "$TRIGGER_SHA" || { echo "Matrix runs do not match the triggering main commit" >&2; exit 1; }
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "apk_run_id=$APK_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ipk_run_id=$IPK_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "build_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "Both successful matrix runs match source commit $APK_SHA."
      - name: Download APK matrix artifacts
        if: ${{ steps.runs.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.runs.outputs.apk_run_id }}
        run: |
          set -eux
          mkdir -p artifacts/apk-matrix
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'openrung-openwrt-25.12-*' --dir artifacts/apk-matrix
          test "$(find artifacts/apk-matrix -type f -name '*.apk' | wc -l)" -eq 20

      - name: Download IPK matrix artifacts
        if: ${{ steps.runs.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.runs.outputs.ipk_run_id }}
        run: |
          set -eux
          mkdir -p artifacts/ipk-matrix
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'openrung-openwrt-24.10-*' --dir artifacts/ipk-matrix
          test "$(find artifacts/ipk-matrix -type f -name '*.ipk' | wc -l)" -eq 20

      - name: Collect existing x86_64 stable packages without changing the old Release
        if: ${{ steps.runs.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p artifacts/x86
          gh release download openwrt-packages --repo "$GITHUB_REPOSITORY" \
            --pattern 'openrung-client_x86_64.apk' \
            --pattern 'luci-app-openrung_all.apk' \
            --pattern 'openrung-client_x86_64.ipk' \
            --pattern 'luci-app-openrung_all.ipk' \
            --dir artifacts/x86
          test "$(find artifacts/x86 -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Assemble and verify independent multi-architecture Release
        id: assemble
        if: ${{ steps.runs.outputs.ready == 'true' }}
        env:
          APK_RUN_ID: ${{ steps.runs.outputs.apk_run_id }}
          IPK_RUN_ID: ${{ steps.runs.outputs.ipk_run_id }}
          MATRIX_BUILD_SHA: ${{ steps.runs.outputs.build_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts/apk-matrix -type f -name '*.apk' -exec cp -v {} dist/ \;
          find artifacts/ipk-matrix -type f -name '*.ipk' -exec cp -v {} dist/ \;
          cp artifacts/x86/*.apk artifacts/x86/*.ipk dist/

          find artifacts/apk-matrix artifacts/ipk-matrix -type f -name BUILD-INFO.txt -print0 |
          while IFS= read -r -d '' info; do
            parent="$(basename "$(dirname "$info")")"
            install -m 0644 "$info" "dist/BUILD-INFO-$parent.txt"
          done

          APK_COUNT="$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)"
          IPK_COUNT="$(find dist -maxdepth 1 -type f -name '*.ipk' | wc -l)"
          BUILD_INFO_COUNT="$(find dist -maxdepth 1 -type f -name 'BUILD-INFO-*.txt' | wc -l)"
          test "$APK_COUNT" -eq 22
          test "$IPK_COUNT" -eq 22
          test "$BUILD_INFO_COUNT" -eq 20
          UPSTREAM_COMMITS="$(grep -h '^OpenRung commit:' dist/BUILD-INFO-*.txt | awk '{print $3}' | sort -u)"
          test "$(printf '%s\n' "$UPSTREAM_COMMITS" | grep -c .)" -eq 1
          UPSTREAM_COMMIT="$(printf '%s\n' "$UPSTREAM_COMMITS" | head -n 1)"
          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]

          for target in \
            arm64-armsr-armv8 armv7-armsr-armv7 mipsel-ramips-mt7621 \
            mips-malta-be mips-ath79-generic mipsel-malta-le \
            mips64el-malta-le64 mips64-octeon riscv64-sifiveu riscv64-starfive
          do
            test -s "dist/openrung-client-$target.apk"
            test -s "dist/luci-app-openrung-$target.apk"
            test -s "dist/openrung-client-$target.ipk"
            test -s "dist/luci-app-openrung-$target.ipk"
          done

          (
            cd dist
            sha256sum *.apk > APK-SHA256SUMS
            sha256sum *.ipk > IPK-SHA256SUMS
            for file in *.apk *.ipk; do sha256sum "$file" > "$file.sha256"; done
            zip -j openrung-openwrt-25.12-multiarch-apk-bundle.zip *.apk
            zip -j openrung-openwrt-24.10-multiarch-ipk-bundle.zip *.ipk
            sha256sum -c APK-SHA256SUMS
            sha256sum -c IPK-SHA256SUMS
          )

          cp LICENSE COPYRIGHT.md THIRD_PARTY_NOTICES.md DISTRIBUTION-NOTICE-ADDENDUM.md dist/
          cat > dist/BUILD-MANIFEST.txt <<EOF
          OpenRung multi-architecture OpenWrt package release
          Packaging repository: https://github.com/${GITHUB_REPOSITORY}
          Release workflow commit: ${GITHUB_SHA}
          Exact matrix packaging commit: ${MATRIX_BUILD_SHA}
          OpenWrt 25.12 APK matrix run: ${APK_RUN_ID}
          OpenWrt 24.10.8 IPK matrix run: ${IPK_RUN_ID}
          APK package count: ${APK_COUNT}
          IPK package count: ${IPK_COUNT}
          Exact OpenRung upstream commit: ${UPSTREAM_COMMIT}
          x86_64 packages are carried forward from the existing openwrt-packages Release.
          ARM, MIPS and RISC-V packages are SDK-built artifacts from the two validated matrix runs.
          Target hardware runtime verification is still recommended before deployment.
          EOF
          (
            cd dist
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS-RELEASE*' -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS-RELEASE
          )
          echo "upstream_commit=$UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Set up Go for corresponding-source archive
        if: ${{ steps.runs.outputs.ready == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - name: Create exact packaging and vendored upstream source archive
        if: ${{ steps.runs.outputs.ready == 'true' }}
        env:
          MATRIX_BUILD_SHA: ${{ steps.runs.outputs.build_sha }}
          UPSTREAM_COMMIT: ${{ steps.assemble.outputs.upstream_commit }}
          APK_RUN_ID: ${{ steps.runs.outputs.apk_run_id }}
          IPK_RUN_ID: ${{ steps.runs.outputs.ipk_run_id }}
        run: |
          set -euo pipefail
          mkdir -p source-bundle/packaging source-bundle/upstream source-bundle/notices
          git fetch --depth=1 origin "$MATRIX_BUILD_SHA"
          git archive --format=tar.gz --prefix="openwrt-openrung-$MATRIX_BUILD_SHA/" "$MATRIX_BUILD_SHA" > "source-bundle/packaging/openwrt-openrung-source-$MATRIX_BUILD_SHA.tar.gz"
          git clone --filter=blob:none https://github.com/openrung/openrung.git upstream-source
          git -C upstream-source fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C upstream-source checkout --detach FETCH_HEAD
          test "$(git -C upstream-source rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          (
            cd upstream-source
            go mod vendor
            test -s vendor/modules.txt
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go list -mod=vendor -tags='with_utls,with_external_windivert' ./cmd/client >/dev/null
          )
          tar --exclude='./.git' --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C upstream-source . | gzip -n > "source-bundle/upstream/openrung-upstream-$UPSTREAM_COMMIT-with-vendor.tar.gz"
          cp LICENSE COPYRIGHT.md THIRD_PARTY_NOTICES.md DISTRIBUTION-NOTICE-ADDENDUM.md source-bundle/notices/
          cp upstream-source/LICENSE source-bundle/notices/OPENRUNG-UPSTREAM-LICENSE.txt
          cp upstream-source/THIRD_PARTY_NOTICES.md source-bundle/notices/OPENRUNG-THIRD-PARTY-NOTICES.md
          MODULE_COUNT="$(grep -c '^# ' upstream-source/vendor/modules.txt || true)"
          LICENSE_COUNT="$(find upstream-source/vendor -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) | wc -l)"
          test "$MODULE_COUNT" -gt 0
          test "$LICENSE_COUNT" -gt 0
          cat > source-bundle/SOURCE-MANIFEST.txt <<EOF
          OpenRung OpenWrt multi-architecture corresponding source
          Packaging repository: https://github.com/${GITHUB_REPOSITORY}
          Exact packaging commit: ${MATRIX_BUILD_SHA}
          Upstream repository: https://github.com/openrung/openrung
          Exact upstream commit: ${UPSTREAM_COMMIT}
          OpenWrt 25.12 APK matrix run: ${APK_RUN_ID}
          OpenWrt 24.10.8 IPK matrix run: ${IPK_RUN_ID}
          Vendored Go module entries: ${MODULE_COUNT}
          Vendor license/notice files found: ${LICENSE_COUNT}
          The archive contains exact packaging source, exact upstream source with vendored Go dependencies,
          build metadata, project license, upstream license and third-party notices.
          EOF
          (
            cd source-bundle
            find . -type f -printf '%P\n' | sort | xargs -r sha256sum > SHA256SUMS-SOURCE
            sha256sum SHA256SUMS-SOURCE > SHA256SUMS-SOURCE.sha256
          )
          BUNDLE="openrung-corresponding-source-$UPSTREAM_COMMIT.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "dist/$BUNDLE" -C source-bundle .
          (cd dist && sha256sum "$BUNDLE" > "$BUNDLE.sha256" && sha256sum -c "$BUNDLE.sha256")
          tar -tzf "dist/$BUNDLE" >/dev/null
          echo "Created exact source bundle: $BUNDLE"

      - name: Publish a new independent formal Release (old Release is untouched)
        if: ${{ steps.runs.outputs.ready == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-packages-multiarch
          target_commitish: ${{ github.sha }}
          name: "OpenRung OpenWrt 多架构软件包（APK + IPK）"
          body: |
            # OpenRung OpenWrt 多架构软件包

            本 Release 与原有 openwrt-packages 正式版分开，不会覆盖或删除旧版资产。

            ## 下载选择

            - OpenWrt 25.12（APK）：选择与 DISTRIB_TARGET 对应的 APK。
            - OpenWrt 24.10（opkg/IPK）：选择与 DISTRIB_TARGET 对应的 IPK。
            - x86_64：保留原有稳定包名。
            - ZIP 合集：分别提供 25.12 APK 与 24.10 IPK 多架构合集。
            - 每个安装包均提供独立 .sha256 校验文件。
            - 提供与本次多架构构建精确对应的上游源码、vendor 依赖和打包源码归档。

            ## 兼容性说明

            ARM64、ARMv7、MIPS 大小端/32/64 位及 RISC-V 安装包由对应 OpenWrt 官方 SDK 构建，并通过包归档、包内容和 ELF class/endianness 检查。真实路由器上的安装、procd 启动及代理连接仍需结合具体设备验证；不同 ABI 不得混装。

            ## 安装

            仓库提供按 OpenWrt 版本、DISTRIB_TARGET 和包管理器精确选择安装包的 install.sh。未知目标会安全停止，不会回退到近似架构。
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: false
