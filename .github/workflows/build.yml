name: Build OpenRung OpenWrt IPK

on:
  workflow_dispatch:
    inputs:
      openrung_ref:
        description: "OpenRung git ref (tag/branch/commit)"
        required: false
        default: "main"
  push:
    paths:
      - ".github/workflows/build.yml"
      - "package/**"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential opkg-utils file
      - name: Set Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - name: Checkout official OpenRung
        env:
          INPUT_REF: ${{ inputs.openrung_ref }}
        run: |
          REF="${INPUT_REF:-main}"
          git clone --depth 1 --branch "$REF" https://github.com/openrung/openrung.git upstream
          echo "OPENRUNG_COMMIT=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build Linux amd64 client
        working-directory: upstream
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go version
          go build -trimpath -tags 'with_utls,with_external_windivert' \
            -ldflags='-s -w' -o ../openrung-client ./cmd/client
          file ../openrung-client
          ../openrung-client --version

      - name: Assemble IPK packages
        run: |
          set -eux
          VERSION="0.1.0+${OPENRUNG_COMMIT:0:8}"
          mkdir -p out
          mkdir -p work/client/usr/bin work/client/etc/config work/client/etc/init.d
          install -m 0755 openrung-client work/client/usr/bin/openrung-client
          cp package/openrung-client/openrung.config work/client/etc/config/openrung
          install -m 0755 package/openrung-client/openrung.init work/client/etc/init.d/openrung
          mkdir -p work/client/CONTROL
          cat > work/client/CONTROL/control <<EOF
          Package: openrung-client
          Version: ${VERSION}
          Architecture: x86_64
          Maintainer: OpenWrt OpenRung Community
          Depends: libc
          Description: OpenRung CLI client for OpenWrt x86_64
          EOF
          opkg-build -o root -g root work/client out

          mkdir -p work/luci/CONTROL work/luci/usr/lib/lua/luci/controller work/luci/usr/lib/lua/luci/model/cbi/openrung
          install -m 0644 package/luci-app-openrung/controller.lua work/luci/usr/lib/lua/luci/controller/openrung.lua
          install -m 0644 package/luci-app-openrung/openrung.lua work/luci/usr/lib/lua/luci/model/cbi/openrung/main.lua
          cat > work/luci/CONTROL/control <<EOF
          Package: luci-app-openrung
          Version: ${VERSION}
          Architecture: all
          Maintainer: OpenWrt OpenRung Community
          Depends: luci-base, openrung-client
          Description: Chinese LuCI management page for OpenRung
          EOF
          opkg-build -o root -g root work/luci out
          cp out/*.ipk .
          sha256sum ./*.ipk > SHA256SUMS
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: openrung-openwrt-ipk
          path: |
            *.ipk
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
