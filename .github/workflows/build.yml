name: Build OpenRung OpenWrt IPK

on:
  workflow_dispatch:
    inputs:
      openrung_ref:
        description: "OpenRung git ref (tag/branch/commit)"
        required: false
        default: "main"
  push:
    paths:
      - ".github/workflows/build.yml"
      - "package/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: openrung-ipk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file python3

      - name: Set Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - name: Checkout official OpenRung
        env:
          INPUT_REF: ${{ inputs.openrung_ref }}
        run: |
          set -eux
          REF="${INPUT_REF:-main}"
          git init upstream
          git -C upstream remote add origin https://github.com/openrung/openrung.git
          git -C upstream fetch --depth 1 origin "$REF"
          git -C upstream checkout --detach FETCH_HEAD
          COMMIT="$(git -C upstream rev-parse HEAD)"
          echo "OPENRUNG_COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "OpenRung commit: $COMMIT"

      - name: Build Linux x86_64 and ARM64 clients
        working-directory: upstream
        env:
          CGO_ENABLED: "0"
        run: |
          set -eux
          go version

          # OpenWrt package architectures:
          # x86_64        -> Linux amd64
          # aarch64_generic -> Linux arm64
          for target in "amd64 x86_64" "arm64 aarch64_generic"; do
            set -- $target
            GOARCH="$1"
            PACKAGE_ARCH="$2"

            echo "===== Building Linux/$GOARCH ($PACKAGE_ARCH) ====="
            GOOS=linux GOARCH="$GOARCH" go build \
              -trimpath \
              -tags 'with_utls,with_external_windivert' \
              -ldflags='-s -w' \
              -o "../openrung-client-$PACKAGE_ARCH" \
              ./cmd/client

            file "../openrung-client-$PACKAGE_ARCH"
            test -s "../openrung-client-$PACKAGE_ARCH"
          done

      - name: Assemble OpenWrt IPK packages
        run: |
          set -eux

          VERSION="0.1.0+${OPENRUNG_COMMIT:0:8}.${GITHUB_SHA:0:8}"

          mkdir -p out

          for PACKAGE_ARCH in x86_64 aarch64_generic; do
            mkdir -p \
              "work/$PACKAGE_ARCH/usr/bin" \
              "work/$PACKAGE_ARCH/usr/libexec" \
              "work/$PACKAGE_ARCH/etc/config" \
              "work/$PACKAGE_ARCH/etc/init.d" \
              "work/$PACKAGE_ARCH/CONTROL"

            install -m 0755 "openrung-client-$PACKAGE_ARCH" \
              "work/$PACKAGE_ARCH/usr/libexec/openrung-client.bin"

            install -m 0755 \
              package/openrung-client/openrung-client-wrapper \
              "work/$PACKAGE_ARCH/usr/bin/openrung-client"

            install -m 0644 \
              package/openrung-client/openrung.config \
              "work/$PACKAGE_ARCH/etc/config/openrung"

            printf '%s\n' '/etc/config/openrung' > "work/$PACKAGE_ARCH/CONTROL/conffiles"

            install -m 0755 \
              package/openrung-client/openrung.init \
              "work/$PACKAGE_ARCH/etc/init.d/openrung"

            install -m 0755 \
              package/openrung-client/openrung.postinst \
              "work/$PACKAGE_ARCH/CONTROL/postinst"

            mkdir -p "work/$PACKAGE_ARCH/usr/share/openrung"
            cp upstream/LICENSE "work/$PACKAGE_ARCH/usr/share/openrung/LICENSE"

            if [ -f upstream/THIRD_PARTY_NOTICES.md ]; then
              cp upstream/THIRD_PARTY_NOTICES.md \
                "work/$PACKAGE_ARCH/usr/share/openrung/THIRD_PARTY_NOTICES.md"
            fi

            cat > "work/$PACKAGE_ARCH/CONTROL/control" <<EOF
          Package: openrung-client
          Version: ${VERSION}
          Architecture: ${PACKAGE_ARCH}
          Maintainer: OpenWrt OpenRung Community
          Description: OpenRung CLI client for OpenWrt (${PACKAGE_ARCH})
          EOF

            python3 build_ipk.py \
              "work/$PACKAGE_ARCH" \
              "out/openrung-client_${VERSION}_${PACKAGE_ARCH}.ipk"

            cp "out/openrung-client_${VERSION}_${PACKAGE_ARCH}.ipk" \
              "out/openrung-client_${PACKAGE_ARCH}.ipk"
          done

          mkdir -p work/luci/CONTROL
          mkdir -p work/luci/usr/lib/lua/luci/controller
          mkdir -p work/luci/usr/lib/lua/luci/model/cbi/openrung

          install -m 0644 \
            package/luci-app-openrung/controller.lua \
            work/luci/usr/lib/lua/luci/controller/openrung.lua

          install -m 0644 \
            package/luci-app-openrung/openrung.lua \
            work/luci/usr/lib/lua/luci/model/cbi/openrung/main.lua

          cat > work/luci/CONTROL/control <<EOF
          Package: luci-app-openrung
          Version: ${VERSION}
          Architecture: all
          Maintainer: OpenWrt OpenRung Community
          Depends: luci-base, openrung-client
          Description: Chinese LuCI management page for OpenRung
          EOF

          cat > build_ipk.py <<'PY'
          import sys
          import tarfile
          import tempfile
          from pathlib import Path

          def make_tar_gz(source, output, exclude_control=False):
              source = Path(source)
              with tarfile.open(output, "w:gz", format=tarfile.GNU_FORMAT) as tar:
                  for path in sorted(source.rglob("*")):
                      rel = path.relative_to(source)
                      if exclude_control and rel.parts and rel.parts[0] == "CONTROL":
                          continue
                      tar.add(path, arcname="./" + str(rel), recursive=False)

          def build(source, output):
              source = Path(source)
              output = Path(output).resolve()
              with tempfile.TemporaryDirectory() as tmpdir:
                  tmp = Path(tmpdir)
                  make_tar_gz(source / "CONTROL", tmp / "control.tar.gz")
                  make_tar_gz(source, tmp / "data.tar.gz", exclude_control=True)
                  (tmp / "debian-binary").write_text("2.0" + chr(10), encoding="ascii")
                  with tarfile.open(output, "w:gz", format=tarfile.GNU_FORMAT) as tar:
                      tar.add(tmp / "debian-binary", arcname="./debian-binary")
                      tar.add(tmp / "data.tar.gz", arcname="./data.tar.gz")
                      tar.add(tmp / "control.tar.gz", arcname="./control.tar.gz")

          build(sys.argv[1], sys.argv[2])
          PY

          python3 build_ipk.py work/luci out/luci-app-openrung_${VERSION}_all.ipk
          cp out/luci-app-openrung_${VERSION}_all.ipk out/luci-app-openrung_all.ipk

          cp out/*.ipk .
          sha256sum ./*.ipk > SHA256SUMS
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

          ls -lh ./*.ipk
          cat SHA256SUMS

      - name: Verify OpenWrt IPK packages
        run: |
          set -eux

          sh -n package/openrung-client/openrung-client-wrapper
          sh -n package/openrung-client/openrung.init
          sh -n package/openrung-client/openrung.postinst

          for pkg in \
            "openrung-client_${PACKAGE_VERSION}_x86_64.ipk" \
            "openrung-client_${PACKAGE_VERSION}_aarch64_generic.ipk" \
            "luci-app-openrung_${PACKAGE_VERSION}_all.ipk"; do
            echo "===== Verify $pkg ====="
            gzip -t "$pkg"
            tar -tzf "$pkg"

            mkdir -p verify
            tar -xzf "$pkg" -C verify
            test "$(cat verify/debian-binary)" = "2.0"
            gzip -t verify/control.tar.gz
            tar -tzf verify/control.tar.gz
            tar -xOzf verify/control.tar.gz ./control
            gzip -t verify/data.tar.gz
            tar -tzf verify/data.tar.gz
            rm -rf verify
          done

          echo "All x86_64, ARM64 and LuCI IPK packages verified successfully."

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrung-openwrt-ipk-universal
          path: |
            *.ipk
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-latest
          name: OpenWrt latest universal IPK packages
          target_commitish: ${{ github.sha }}
          body: |
            Automatically built OpenRung packages for OpenWrt x86_64 and ARM64.
            The LuCI package is architecture-independent.
            Stable asset names are intended for direct download from OpenWrt.
          files: |
            out/openrung-client_x86_64.ipk
            out/openrung-client_aarch64_generic.ipk
            out/luci-app-openrung_all.ipk
            SHA256SUMS
          overwrite_files: true
          make_latest: true
