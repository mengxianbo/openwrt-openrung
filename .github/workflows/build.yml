name: Build OpenRung OpenWrt IPK

on:
  workflow_dispatch:
    inputs:
      openrung_ref:
        description: "OpenRung git ref (tag/branch/commit)"
        required: false
        default: "main"
  push:
    paths:
      - ".github/workflows/build.yml"
      - "package/**"
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file python3

      - name: Set Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - name: Checkout official OpenRung
        env:
          INPUT_REF: ${{ inputs.openrung_ref }}
        run: |
          set -eux
          REF="${INPUT_REF:-main}"
          git init upstream
          git -C upstream remote add origin https://github.com/openrung/openrung.git
          git -C upstream fetch --depth 1 origin "$REF"
          git -C upstream checkout --detach FETCH_HEAD
          COMMIT="$(git -C upstream rev-parse HEAD)"
          echo "OPENRUNG_COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "OpenRung commit: $COMMIT"

      - name: Build Linux amd64 client
        working-directory: upstream
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -eux
          go version
          go build \
            -trimpath \
            -tags 'with_utls,with_external_windivert' \
            -ldflags='-s -w' \
            -o ../openrung-client \
            ./cmd/client
          file ../openrung-client
          test -s ../openrung-client

      - name: Assemble valid IPK packages
        run: |
          set -eux
          VERSION="0.1.0+${OPENRUNG_COMMIT:0:8}"

          mkdir -p out work/client/usr/bin work/client/etc/config work/client/etc/init.d work/client/CONTROL
          install -m 0755 openrung-client work/client/usr/bin/openrung-client
          install -m 0644 package/openrung-client/openrung.config work/client/etc/config/openrung
          install -m 0755 package/openrung-client/openrung.init work/client/etc/init.d/openrung

          mkdir -p work/client/usr/share/openrung
          cp upstream/LICENSE work/client/usr/share/openrung/LICENSE
          if [ -f upstream/THIRD_PARTY_NOTICES.md ]; then cp upstream/THIRD_PARTY_NOTICES.md work/client/usr/share/openrung/THIRD_PARTY_NOTICES.md; fi

          cat > work/client/CONTROL/control <<EOF
          Package: openrung-client
          Version: ${VERSION}
          Architecture: x86_64
          Maintainer: OpenWrt OpenRung Community
          Description: OpenRung CLI client for OpenWrt x86_64
          EOF

          mkdir -p work/luci/CONTROL
          mkdir -p work/luci/usr/lib/lua/luci/controller
          mkdir -p work/luci/usr/lib/lua/luci/model/cbi/openrung
          install -m 0644 package/luci-app-openrung/controller.lua work/luci/usr/lib/lua/luci/controller/openrung.lua
          install -m 0644 package/luci-app-openrung/openrung.lua work/luci/usr/lib/lua/luci/model/cbi/openrung/main.lua

          cat > work/luci/CONTROL/control <<EOF
          Package: luci-app-openrung
          Version: ${VERSION}
          Architecture: all
          Maintainer: OpenWrt OpenRung Community
          Depends: luci-base, openrung-client
          Description: Chinese LuCI management page for OpenRung
          EOF

          cat > build_ipk.py <<'PY'
          import gzip
          import sys
          import tarfile
          import tempfile
          from pathlib import Path

          def make_tar_gz(source, output, exclude_control=False):
              source = Path(source)
              with open(output, "wb") as raw:
                  with gzip.GzipFile(fileobj=raw, mode="wb", mtime=0) as gz:
                      with tarfile.open(fileobj=gz, mode="w") as tar:
                          for path in sorted(source.rglob("*")):
                              rel = path.relative_to(source)
                              if exclude_control and rel.parts and rel.parts[0] == "CONTROL":
                                  continue
                              tar.add(path, arcname="./" + str(rel), recursive=False)

          def ar_member(name, data):
              header = (
                  (name + "/").encode().ljust(16, b" ")
                  + b"0".ljust(12, b" ")
                  + b"0".ljust(6, b" ")
                  + b"0".ljust(6, b" ")
                  + b"100644".ljust(8, b" ")
                  + str(len(data)).encode().ljust(10, b" ")
                  + b"`\n"
              )
              return header + data + (b"\n" if len(data) % 2 else b"")

          def build(source, output):
              source = Path(source)
              with tempfile.TemporaryDirectory() as tmp:
                  tmp = Path(tmp)
                  control = tmp / "control.tar.gz"
                  data = tmp / "data.tar.gz"

                  # IPK control archive must contain ./control at its root.
                  make_tar_gz(source / "CONTROL", control)
                  # Payload archive contains package files, but not CONTROL/.
                  make_tar_gz(source, data, exclude_control=True)

                  with open(output, "wb") as f:
                      f.write(b"!<arch>\n")
                      f.write(ar_member("debian-binary", b"2.0\n"))
                      f.write(ar_member("control.tar.gz", control.read_bytes()))
                      f.write(ar_member("data.tar.gz", data.read_bytes()))

          build(sys.argv[1], sys.argv[2])
          PY

          python3 build_ipk.py work/client out/openrung-client_${VERSION}_x86_64.ipk
          python3 build_ipk.py work/luci out/luci-app-openrung_${VERSION}_all.ipk

          # Stable names for direct installation from OpenWrt.
          cp out/openrung-client_${VERSION}_x86_64.ipk out/openrung-client_x86_64.ipk
          cp out/luci-app-openrung_${VERSION}_all.ipk out/luci-app-openrung_all.ipk
          cp out/*.ipk .
          sha256sum ./*.ipk > SHA256SUMS
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -lh ./*.ipk
          cat SHA256SUMS

      - name: Verify IPK archive structure
        run: |
          set -eux
          for pkg in openrung-client_${PACKAGE_VERSION}_x86_64.ipk luci-app-openrung_${PACKAGE_VERSION}_all.ipk; do
            ar t "$pkg"
            mkdir -p verify
            (cd verify && ar x "../$pkg" control.tar.gz)
            tar -tzf verify/control.tar.gz
            tar -xOzf verify/control.tar.gz ./control | head
            rm -rf verify
          done

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrung-openwrt-ipk
          path: |
            *.ipk
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-latest
          name: OpenWrt latest IPK packages
          target_commitish: main
          body: |
            Automatically built OpenRung packages for OpenWrt x86_64.
            Stable asset names are intended for direct download from OpenWrt.
          files: |
            out/openrung-client_x86_64.ipk
            out/luci-app-openrung_all.ipk
            SHA256SUMS
          overwrite_files: true
          make_latest: true
