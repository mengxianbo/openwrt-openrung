name: Build OpenRung OpenWrt 25.12 APK

on:
  workflow_dispatch:
    inputs:
      openrung_ref:
        description: "Official OpenRung client git ref (tag, branch or commit)"
        required: true
        default: "main"
  push:
    paths:
      - "package/openrung-client/**"
      - "package/luci-app-openrung/**"
      - "DISTRIBUTION-NOTICE-ADDENDUM.md"
      - "COPYRIGHT.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  # Serialize APK and IPK publication to the same unified Release.
  # The workflows publish distinct asset filenames and must not clean up each other's files.
  group: openrung-unified-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget zstd zip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - name: Download official OpenWrt 25.12.6 x86/64 SDK
        run: |
          set -eux
          SDK_FILE="openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          SDK_URL="https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/$SDK_FILE"
          SDK_SHA256="1864152619092e781fa36a401960c8e9ae42d6a364c44ee5f0b197ca5f3c0fcc"
          wget -q "$SDK_URL" -O "/tmp/$SDK_FILE"
          echo "$SDK_SHA256  /tmp/$SDK_FILE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar --zstd -xf "/tmp/$SDK_FILE" -C "$RUNNER_TEMP/openwrt-sdk" --strip-components=1
          echo "SDK_DIR=$RUNNER_TEMP/openwrt-sdk" >> "$GITHUB_ENV"

      - name: Checkout official OpenRung source
        env:
          INPUT_REF: ${{ inputs.openrung_ref }}
        run: |
          set -eux
          REF="${INPUT_REF:-main}"
          git clone --filter=blob:none https://github.com/openrung/openrung.git upstream
          git -C upstream fetch --depth 1 origin "$REF"
          git -C upstream checkout --detach FETCH_HEAD
          echo "OPENRUNG_COMMIT=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Collect vendored third-party license texts
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          go mod vendor
          test -s vendor/modules.txt
          LICENSE_DIR="$RUNNER_TEMP/openrung-third-party-licenses"
          mkdir -p "$LICENSE_DIR"
          count=0
          while IFS= read -r -d '' file; do
            rel="${file#vendor/}"
            dest="$LICENSE_DIR/$rel"
            mkdir -p "$(dirname "$dest")"
            install -m 0644 "$file" "$dest"
            count=$((count + 1))
          done < <(find vendor -type f \
            \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) -print0)
          test "$count" -gt 0
          echo "THIRD_PARTY_LICENSES_DIR=$LICENSE_DIR" >> "$GITHUB_ENV"
          echo "Collected $count vendored third-party license/notice files"

      - name: Build OpenRung Linux amd64 client
        working-directory: upstream
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -eux
          go version
          go build -trimpath -tags 'with_utls,with_external_windivert' \
            -ldflags='-s -w' -o ../openrung-client.bin ./cmd/client
          file ../openrung-client.bin
          test -s ../openrung-client.bin

      - name: Build native OpenWrt APK packages
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          set -eux
          SDK="$SDK_DIR"

          mkdir -p "$SDK/package/openrung-client/files"
          cp package/openrung-client/openrung-client-wrapper "$SDK/package/openrung-client/files/"
          cp package/openrung-client/openrung.config "$SDK/package/openrung-client/files/"
          cp package/openrung-client/openrung.init "$SDK/package/openrung-client/files/"
          cp openrung-client.bin upstream/LICENSE upstream/THIRD_PARTY_NOTICES.md \
            "$SDK/package/openrung-client/files/"
          cp COPYRIGHT.md "$SDK/package/openrung-client/files/COPYRIGHT.md"
          mkdir -p "$SDK/package/openrung-client/files/licenses/third-party"
          cp -a "$THIRD_PARTY_LICENSES_DIR/." \\
            "$SDK/package/openrung-client/files/licenses/third-party/"
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("upstream/THIRD_PARTY_NOTICES.md")
          target = Path("upstream/THIRD_PARTY_NOTICES-DISTRIBUTION.md")
          content = source.read_text(encoding="utf-8")
          content = re.sub(
              r"<add contact /\s*repo issues URL>",
              "https://github.com/mengxianbo/openwrt-openrung/issues",
              content,
          )
          content = content.replace(
              "<add public repo URL>",
              "https://github.com/openrung/openrung",
          )
          if re.search(r"<add\s+[^>]*>", content, flags=re.IGNORECASE):
              raise SystemExit("Unresolved distributor placeholder remains in APK notices")
          target.write_text(content, encoding="utf-8")
          PY
          cp upstream/THIRD_PARTY_NOTICES-DISTRIBUTION.md \
            "$SDK/package/openrung-client/files/THIRD_PARTY_NOTICES.md"

          cp -a package/openrung-client/Makefile "$SDK/package/openrung-client/Makefile"
          cp -a package/luci-app-openrung "$SDK/package/"
          cp LICENSE COPYRIGHT.md DISTRIBUTION-NOTICE-ADDENDUM.md "$SDK/"

          cd "$SDK"
          make defconfig
          # Generate the SDK configuration before checking its APK backend.
          grep -q '^CONFIG_USE_APK=y' .config
          make package/openrung-client/compile package/luci-app-openrung/compile -j"$(nproc)" V=s

          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin/packages -type f -name '*.apk' -print
          find bin/packages -type f \( -name 'openrung-client*.apk' -o -name 'luci-app-openrung*.apk' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;

          cd "$GITHUB_WORKSPACE"
          CLIENT_APK="$(find dist -maxdepth 1 -type f -name 'openrung-client*.apk' -print -quit)"
          LUCI_APK="$(find dist -maxdepth 1 -type f -name 'luci-app-openrung*.apk' -print -quit)"
          test -n "$CLIENT_APK"
          test -n "$LUCI_APK"
          # Publish stable filenames so router installation commands never depend on version strings.
          cp "$CLIENT_APK" dist/openrung-client_x86_64.apk
          cp "$LUCI_APK" dist/luci-app-openrung_all.apk
          rm -f "$CLIENT_APK" "$LUCI_APK"

          cp upstream/LICENSE dist/OPENRUNG-UPSTREAM-LICENSE
          cp upstream/THIRD_PARTY_NOTICES-DISTRIBUTION.md dist/THIRD_PARTY_NOTICES.md
          cp LICENSE dist/PACKAGING-LICENSE
          cp COPYRIGHT.md dist/COPYRIGHT.md
          if grep -nE '<add[[:space:]]' dist/THIRD_PARTY_NOTICES.md; then
            echo "Unresolved third-party notice placeholder in APK distribution" >&2
            exit 1
          fi
          cat > dist/SOURCE-INFO.txt <<EOF
          Packaging repository: https://github.com/${GITHUB_REPOSITORY}
          Packaging commit: ${GH_SHA}
          OpenWrt SDK: 25.12.6 x86/64
          OpenRung upstream: https://github.com/openrung/openrung
          OpenRung upstream commit: ${OPENRUNG_COMMIT}
          Corresponding-source archive:
          https://github.com/mengxianbo/openwrt-openrung/releases/download/openwrt-packages/openrung-corresponding-source-apk-${OPENRUNG_COMMIT}.tar.gz
          SHA256:
          https://github.com/mengxianbo/openwrt-openrung/releases/download/openwrt-packages/openrung-corresponding-source-apk-${OPENRUNG_COMMIT}.tar.gz.sha256
          EOF
          (cd dist && sha256sum openrung-client_x86_64.apk luci-app-openrung_all.apk > APK-SHA256SUMS)
          # Bundle both installable APKs into one convenient download.
          (cd dist && zip -j openrung-openwrt-25.12-x86_64-bundle.zip openrung-client_x86_64.apk luci-app-openrung_all.apk)
          ls -lh dist

      - name: Verify APK license and copyright payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          import tarfile
          from pathlib import Path

          checks = {
              "openrung-client_x86_64.apk": [
                  "usr/share/openrung/LICENSE",
                  "usr/share/openrung/COPYRIGHT.md",
                  "usr/share/openrung/THIRD_PARTY_NOTICES.md",
              ],
              "luci-app-openrung_all.apk": [
                  "usr/share/licenses/luci-app-openrung/LICENSE",
                  "usr/share/licenses/luci-app-openrung/COPYRIGHT.md",
              ],
          }

          for filename, required in checks.items():
              path = Path("dist") / filename
              with tarfile.open(path, "r:*") as outer:
                  data_member = next(
                      (m for m in outer.getmembers()
                       if m.isfile() and m.name.endswith("data.tar.gz")),
                      None,
                  )
                  if data_member is None:
                      raise SystemExit(f"FAIL: {filename}: APK data archive missing")
                  data_blob = outer.extractfile(data_member).read()
              with tarfile.open(fileobj=io.BytesIO(data_blob), mode="r:*") as data:
                  files = {
                      m.name.removeprefix("./"): data.extractfile(m).read()
                      for m in data.getmembers() if m.isfile()
                  }
              for name in required:
                  if name not in files or not files[name].strip():
                      raise SystemExit(f"FAIL: {filename}: {name} missing or empty")
              if filename.startswith("openrung-client"):
                  third_party = [
                      name for name, content in files.items()
                      if name.startswith("usr/share/openrung/licenses/third-party/")
                      and content.strip()
                  ]
                  if not third_party:
                      raise SystemExit("FAIL: APK client: bundled third-party license texts missing")
                  print(f"PASS: APK client: {len(third_party)} third-party license/notice files verified")
                  notices = files["usr/share/openrung/THIRD_PARTY_NOTICES.md"].decode("utf-8", "replace")
                  if "<add " in notices:
                      raise SystemExit("FAIL: APK third-party notice contains unresolved placeholders")
              print(f"PASS: {filename}: license, copyright and required notices verified")
          PY

      - name: Assemble exact APK corresponding-source archive
        env:
          PACKAGING_COMMIT: ${{ github.sha }}
          UPSTREAM_COMMIT: ${{ env.OPENRUNG_COMMIT }}
        shell: bash
        run: |
          set -euo pipefail
          SRC="source-bundle"
          mkdir -p "${SRC}/packaging" "${SRC}/upstream" "${SRC}/notices"

          git archive --format=tar.gz --prefix="openwrt-openrung-${PACKAGING_COMMIT}/" "${PACKAGING_COMMIT}" \
            > "${SRC}/packaging/openwrt-openrung-source-${PACKAGING_COMMIT}.tar.gz"

          git -C upstream archive --format=tar.gz --prefix="openrung-${UPSTREAM_COMMIT}/" "${UPSTREAM_COMMIT}" \
            > "${SRC}/upstream/openrung-upstream-source-${UPSTREAM_COMMIT}.tar.gz"
          (
            cd upstream
            go mod vendor
            test -s vendor/modules.txt
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go list -mod=vendor -tags='with_utls,with_external_windivert' ./cmd/client >/dev/null
          )
          tar --exclude='./.git' --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner -cf - -C upstream . | gzip -n \
            > "${SRC}/upstream/openrung-upstream-corresponding-source-${UPSTREAM_COMMIT}-with-vendor.tar.gz"

          cp LICENSE COPYRIGHT.md LICENSES.md THIRD_PARTY_NOTICES.md \
            DISTRIBUTION-NOTICE-ADDENDUM.md "${SRC}/notices/"
          cp upstream/LICENSE "${SRC}/notices/OPENRUNG-UPSTREAM-LICENSE.txt"
          cp upstream/THIRD_PARTY_NOTICES.md "${SRC}/notices/OPENRUNG-THIRD-PARTY-NOTICES.md"

          MODULE_COUNT="$(grep -c '^# ' upstream/vendor/modules.txt || true)"
          LICENSE_COUNT="$(find upstream/vendor -type f \
            \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) | wc -l)"
          test "${MODULE_COUNT}" -gt 0
          test "${LICENSE_COUNT}" -gt 0

          cat > "${SRC}/SOURCE-MANIFEST.txt" <<EOF
          OpenRung OpenWrt 25.12 APK corresponding source
          Packaging repository: https://github.com/${GITHUB_REPOSITORY}
          Exact packaging commit: ${PACKAGING_COMMIT}
          Upstream repository: https://github.com/openrung/openrung
          Exact upstream commit: ${UPSTREAM_COMMIT}
          OpenWrt SDK: 25.12.6 x86/64
          Client target: ./cmd/client
          Build platform: linux/amd64
          CGO_ENABLED: 0
          Build tags: with_utls,with_external_windivert
          Go toolchain: $(go version)
          Vendored Go module entries: ${MODULE_COUNT}
          Vendor license/notice files found: ${LICENSE_COUNT}
          This archive contains exact packaging source, exact upstream source,
          the vendor-inclusive upstream source tree, build metadata and license notices.
          EOF

          (
            cd "${SRC}"
            find . -type f -printf '%P\n' | sort | xargs -r sha256sum > SHA256SUMS-SOURCE
            sha256sum SHA256SUMS-SOURCE > SHA256SUMS-SOURCE.sha256
          )

          BUNDLE="openrung-corresponding-source-apk-${UPSTREAM_COMMIT}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner -czf "dist/${BUNDLE}" -C "${SRC}" .
          (cd dist && sha256sum "${BUNDLE}" > "${BUNDLE}.sha256" && sha256sum -c "${BUNDLE}.sha256")
          tar -tzf "dist/${BUNDLE}" >/dev/null
          echo "PASS: APK corresponding source archive created and verified: ${BUNDLE}"

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openrung-openwrt-25.12-x86_64-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove obsolete release assets and old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          KEEP='
          APK-SHA256SUMS
          IPK-SHA256SUMS
          openrung-client_x86_64.apk
          luci-app-openrung_all.apk
          openrung-openwrt-25.12-x86_64-bundle.zip
          openrung-client_x86_64.ipk
          luci-app-openrung_all.ipk
          openrung-ipk.zip
          OPENRUNG-UPSTREAM-LICENSE
          THIRD_PARTY_NOTICES.md
          COPYRIGHT.md
          PACKAGING-LICENSE
          SOURCE-INFO.txt
          '
          RELEASE_ID="$(gh api "repos/$GH_REPO/releases/tags/openwrt-packages" --jq .id 2>/dev/null || true)"
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --paginate --jq '.[].id' |
            while read -r asset_id; do
              name="$(gh api "repos/$GH_REPO/releases/assets/$asset_id" --jq .name)"
              if ! printf '%s\n' "$KEEP" | grep -Fxq "$name" \
                 && [[ "$name" != openrung-corresponding-source-*.tar.gz ]] \
                 && [[ "$name" != openrung-corresponding-source-*.tar.gz.sha256 ]]; then
                echo "Removing obsolete asset: $name"
                gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
              fi
            done
          fi
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name != "openwrt-packages") | [.id,.tag_name] | @tsv' |
          while IFS="$(printf '\t')" read -r release_id tag; do
            echo "Removing obsolete release: $tag"
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag" || true
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-packages
          name: "OpenRung OpenWrt Packages (APK + IPK)"
          body: |
            Unified OpenRung packages for OpenWrt.

            - OpenWrt 25.12: download the APK files or openrung-openwrt-25.12-x86_64-bundle.zip.
            - Older OpenWrt releases using opkg: download the IPK files or openrung-ipk.zip.

            Individual package files are attached alongside both convenience ZIP archives.
            This Release contains installable packages, ZIP bundles, checksums, license notices, the APK corresponding-source archive, and the matching IPK corresponding-source archive when its post-build workflow has completed.
            Source archives are named with the exact upstream commit and include SHA256 verification. Build metadata records the exact packaging and OpenRung upstream commits.
            The original OpenRung client, LuCI controls, procd service, configurable proxy port
            and PassWall guard are retained.

            OpenWrt 25.12 OpenRung upstream commit: ${{ env.OPENRUNG_COMMIT }}
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
