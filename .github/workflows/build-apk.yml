name: Build OpenRung OpenWrt 25.12 APK

on:
  workflow_dispatch:
    inputs:
      openrung_ref:
        description: "Official OpenRung client git ref (tag, branch or commit)"
        required: true
        default: "main"
  push:
    paths:
      - "package/openrung-client/**"
      - "package/luci-app-openrung/**"
      - "DISTRIBUTION-NOTICE-ADDENDUM.md"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  # Serialize APK and IPK publication to the same unified Release.
  # The workflows publish distinct asset filenames and must not clean up each other's files.
  group: openrung-unified-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget zstd zip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - name: Download official OpenWrt 25.12.6 x86/64 SDK
        run: |
          set -eux
          SDK_FILE="openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          SDK_URL="https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/$SDK_FILE"
          SDK_SHA256="1864152619092e781fa36a401960c8e9ae42d6a364c44ee5f0b197ca5f3c0fcc"
          wget -q "$SDK_URL" -O "/tmp/$SDK_FILE"
          echo "$SDK_SHA256  /tmp/$SDK_FILE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar --zstd -xf "/tmp/$SDK_FILE" -C "$RUNNER_TEMP/openwrt-sdk" --strip-components=1
          echo "SDK_DIR=$RUNNER_TEMP/openwrt-sdk" >> "$GITHUB_ENV"

      - name: Checkout official OpenRung source
        env:
          INPUT_REF: ${{ inputs.openrung_ref }}
        run: |
          set -eux
          REF="${INPUT_REF:-main}"
          git clone --filter=blob:none https://github.com/openrung/openrung.git upstream
          git -C upstream fetch --depth 1 origin "$REF"
          git -C upstream checkout --detach FETCH_HEAD
          echo "OPENRUNG_COMMIT=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build OpenRung Linux amd64 client
        working-directory: upstream
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -eux
          go version
          go build -trimpath -tags 'with_utls,with_external_windivert' \
            -ldflags='-s -w' -o ../openrung-client.bin ./cmd/client
          file ../openrung-client.bin
          test -s ../openrung-client.bin

      - name: Build native OpenWrt APK packages
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          set -eux
          SDK="$SDK_DIR"

          mkdir -p "$SDK/package/openrung-client/files"
          cp package/openrung-client/openrung-client-wrapper "$SDK/package/openrung-client/files/"
          cp package/openrung-client/openrung.config "$SDK/package/openrung-client/files/"
          cp package/openrung-client/openrung.init "$SDK/package/openrung-client/files/"
          cp openrung-client.bin upstream/LICENSE upstream/THIRD_PARTY_NOTICES.md \
            "$SDK/package/openrung-client/files/"

          cp -a package/openrung-client/Makefile "$SDK/package/openrung-client/Makefile"
          cp -a package/luci-app-openrung "$SDK/package/"
          cp LICENSE DISTRIBUTION-NOTICE-ADDENDUM.md "$SDK/"

          cd "$SDK"
          make defconfig
          # Generate the SDK configuration before checking its APK backend.
          grep -q '^CONFIG_USE_APK=y' .config
          make package/openrung-client/compile package/luci-app-openrung/compile -j"$(nproc)" V=s

          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin/packages -type f -name '*.apk' -print
          find bin/packages -type f \( -name 'openrung-client*.apk' -o -name 'luci-app-openrung*.apk' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;

          cd "$GITHUB_WORKSPACE"
          CLIENT_APK="$(find dist -maxdepth 1 -type f -name 'openrung-client*.apk' -print -quit)"
          LUCI_APK="$(find dist -maxdepth 1 -type f -name 'luci-app-openrung*.apk' -print -quit)"
          test -n "$CLIENT_APK"
          test -n "$LUCI_APK"
          # Publish stable filenames so router installation commands never depend on version strings.
          cp "$CLIENT_APK" dist/openrung-client_x86_64.apk
          cp "$LUCI_APK" dist/luci-app-openrung_all.apk
          rm -f "$CLIENT_APK" "$LUCI_APK"

          cp upstream/LICENSE dist/OPENRUNG-UPSTREAM-LICENSE
          cp upstream/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          cp LICENSE dist/PACKAGING-LICENSE
          cat > dist/SOURCE-INFO.txt <<EOF
          Packaging repository: https://github.com/${GITHUB_REPOSITORY}
          Packaging commit: ${GH_SHA}
          OpenWrt SDK: 25.12.6 x86/64
          OpenRung upstream: https://github.com/openrung/openrung
          OpenRung upstream commit: ${OPENRUNG_COMMIT}
          EOF
          (cd dist && sha256sum openrung-client_x86_64.apk luci-app-openrung_all.apk > APK-SHA256SUMS)
          # Bundle both installable APKs into one convenient download.
          (cd dist && zip -j openrung-openwrt-25.12-x86_64-bundle.zip openrung-client_x86_64.apk luci-app-openrung_all.apk)
          ls -lh dist

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openrung-openwrt-25.12-x86_64-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove obsolete release assets and old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          KEEP='
          APK-SHA256SUMS
          IPK-SHA256SUMS
          openrung-client_x86_64.apk
          luci-app-openrung_all.apk
          openrung-openwrt-25.12-x86_64-bundle.zip
          openrung-client_x86_64.ipk
          luci-app-openrung_all.ipk
          openrung-ipk.zip
          OPENRUNG-UPSTREAM-LICENSE
          THIRD_PARTY_NOTICES.md
          PACKAGING-LICENSE
          SOURCE-INFO.txt
          '
          RELEASE_ID="$(gh api "repos/$GH_REPO/releases/tags/openwrt-packages" --jq .id 2>/dev/null || true)"
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --paginate --jq '.[].id' |
            while read -r asset_id; do
              name="$(gh api "repos/$GH_REPO/releases/assets/$asset_id" --jq .name)"
              if ! printf '%s\n' "$KEEP" | grep -Fxq "$name"; then
                echo "Removing obsolete asset: $name"
                gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
              fi
            done
          fi
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name != "openwrt-packages") | [.id,.tag_name] | @tsv' |
          while IFS="$(printf '\t')" read -r release_id tag; do
            echo "Removing obsolete release: $tag"
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag" || true
          done

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-packages
          name: "OpenRung OpenWrt Packages (APK + IPK)"
          body: |
            Unified OpenRung packages for OpenWrt.

            - OpenWrt 25.12: download the APK files or openrung-openwrt-25.12-x86_64-bundle.zip.
            - Older OpenWrt releases using opkg: download the IPK files or openrung-ipk.zip.

            Individual package files are attached alongside both convenience ZIP archives.
            This Release contains installable packages, ZIP bundles, checksums and license notices; it is not a source archive.
            Build metadata records the exact packaging and OpenRung upstream commits.
            The original OpenRung client, LuCI controls, procd service, configurable proxy port
            and PassWall guard are retained.

            OpenWrt 25.12 OpenRung upstream commit: ${{ env.OPENRUNG_COMMIT }}
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
