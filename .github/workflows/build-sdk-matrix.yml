name: Build installable OpenWrt 25.12 APK matrix

on:
  workflow_dispatch:
    inputs:
      openrung_ref:
        description: OpenRung upstream ref
        required: true
        default: main
  push:
    paths:
      - '.github/workflows/build-sdk-matrix.yml'
      - 'package/openrung-client/**'
      - 'package/luci-app-openrung/**'
      - 'DISTRIBUTION-NOTICE-ADDENDUM.md'
      - 'COPYRIGHT.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths:
      - '.github/workflows/build-sdk-matrix.yml'
      - 'package/openrung-client/**'
      - 'package/luci-app-openrung/**'
      - 'DISTRIBUTION-NOTICE-ADDENDUM.md'
      - 'COPYRIGHT.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

jobs:
  sdk:
    name: OpenWrt 25.12 APK - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 is built and published by build-apk.yml.
          - name: arm64-armsr-armv8
            target: armsr/armv8
            goarch: arm64
          - name: armv7-armsr-armv7
            target: armsr/armv7
            goarch: arm
            goarm: '7'
          - name: mipsel-ramips-mt7621
            target: ramips/mt7621
            goarch: mipsle
            gomips: softfloat
          - name: mips-malta-be
            target: malta/be
            goarch: mips
            gomips: softfloat
          - name: mips-ath79-generic
            target: ath79/generic
            goarch: mips
            gomips: softfloat
          - name: mipsel-malta-le
            target: malta/le
            goarch: mipsle
            gomips: softfloat
          - name: mips64el-malta-le64
            target: malta/le64
            goarch: mips64le
            gomips64: softfloat
          - name: mips64-octeon
            target: octeon/generic
            goarch: mips64
            gomips64: hardfloat
          - name: riscv64-sifiveu
            target: sifiveu/generic
            goarch: riscv64
          - name: riscv64-starfive
            target: starfive/generic
            goarch: riscv64

    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget zstd

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Download and verify official OpenWrt SDK
        env:
          TARGET: ${{ matrix.target }}
          RELEASE: 25.12.6
        run: |
          set -eux
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import urlopen, urlretrieve
          import hashlib, re, subprocess, os

          target = __import__("os").environ["TARGET"]
          release = __import__("os").environ["RELEASE"]
          base = f"https://downloads.openwrt.org/releases/{release}/targets/{target}/"
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href", "")
                      if href.startswith("openwrt-sdk-") and href.endswith(".tar.zst"):
                          self.links.append(href)

          parser = Links()
          parser.feed(urlopen(base).read().decode("utf-8"))
          if len(parser.links) != 1:
              raise SystemExit(f"Expected exactly one official SDK for {target}; found {parser.links}")
          sdk = parser.links[0]
          sums = urlopen(base + "sha256sums").read().decode("utf-8")
          matches = [line for line in sums.splitlines() if line.split()[-1].lstrip("*").removeprefix("./") == sdk]
          if len(matches) != 1:
              raise SystemExit(f"Official SHA256 entry missing or ambiguous for {sdk}")
          expected = matches[0].split()[0]
          archive = Path("/tmp") / sdk
          urlretrieve(base + sdk, archive)
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          if actual != expected:
              raise SystemExit(f"SDK SHA256 mismatch: expected {expected}, got {actual}")
          print(f"Verified official SDK: {sdk} ({actual})")
          os.makedirs(os.environ["RUNNER_TEMP"] + "/sdk", exist_ok=True)
          subprocess.run(["tar", "--zstd", "-xf", str(archive), "-C", os.environ["RUNNER_TEMP"] + "/sdk", "--strip-components=1"], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SDK_DIR={os.environ['RUNNER_TEMP']}/sdk\n")
          PY

      - name: Build OpenRung client for target ABI
        env:
          INPUT_REF: ${{ inputs.openrung_ref }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
          GOMIPS: ${{ matrix.gomips || '' }}
          GOMIPS64: ${{ matrix.gomips64 || '' }}
        run: |
          set -eux
          REF="${INPUT_REF:-main}"
          git clone --filter=blob:none https://github.com/openrung/openrung.git upstream
          git -C upstream fetch --depth 1 origin "$REF"
          git -C upstream checkout --detach FETCH_HEAD
          echo "OPENRUNG_COMMIT=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"
          cd upstream
          go mod vendor
          test -s vendor/modules.txt
          LICENSE_DIR="$GITHUB_WORKSPACE/third-party-licenses"
          mkdir -p "$LICENSE_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          vendor = Path("vendor")
          destination = Path("../third-party-licenses")
          count = 0
          for source in vendor.rglob("*"):
              if source.is_file() and source.name.lower().startswith(("license", "copying", "notice")):
                  target = destination / source.relative_to(vendor)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  count += 1
          if count == 0:
              raise SystemExit("No vendored license/notice files found")
          print(f"Collected {count} license/notice files")
          PY
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" GOARM="$GOARM" GOMIPS="$GOMIPS" GOMIPS64="$GOMIPS64" \
            go build -mod=vendor -trimpath -tags 'with_utls,with_external_windivert' \
            -ldflags='-s -w' -o ../openrung-client.bin ./cmd/client
          file ../openrung-client.bin
          test -s ../openrung-client.bin

      - name: Build native APK packages using target SDK
        env:
          TARGET_NAME: ${{ matrix.name }}
        run: |
          set -eux
          SDK="$SDK_DIR"
          mkdir -p "$SDK/package/openrung-client/files"
          cp package/openrung-client/openrung-client-wrapper \
            package/openrung-client/openrung.config package/openrung-client/openrung.init \
            "$SDK/package/openrung-client/files/"
          cp openrung-client.bin "$SDK/package/openrung-client/files/openrung-client.bin"
          cp upstream/LICENSE upstream/THIRD_PARTY_NOTICES.md \
            "$SDK/package/openrung-client/files/"
          cp COPYRIGHT.md "$SDK/package/openrung-client/files/COPYRIGHT.md"
          mkdir -p "$SDK/package/openrung-client/files/licenses/third-party"
          cp -a third-party-licenses/. "$SDK/package/openrung-client/files/licenses/third-party/"
          cp package/openrung-client/Makefile "$SDK/package/openrung-client/Makefile"
          cp -a package/luci-app-openrung "$SDK/package/"
          cp LICENSE COPYRIGHT.md DISTRIBUTION-NOTICE-ADDENDUM.md "$SDK/"
          cd "$SDK"
          make defconfig
          grep -q '^CONFIG_USE_APK=y' .config
          make package/openrung-client/compile package/luci-app-openrung/compile -j"$(nproc)" V=s
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin/packages -type f \( -name 'openrung-client*.apk' -o -name 'luci-app-openrung*.apk' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;
          cd "$GITHUB_WORKSPACE"
          CLIENT="$(find dist -maxdepth 1 -name 'openrung-client*.apk' -print -quit)"
          LUCI="$(find dist -maxdepth 1 -name 'luci-app-openrung*.apk' -print -quit)"
          test -n "$CLIENT" && test -n "$LUCI"
          mv "$CLIENT" "dist/openrung-client-${TARGET_NAME}.apk"
          mv "$LUCI" "dist/luci-app-openrung-${TARGET_NAME}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          printf 'OpenWrt release: 25.12.6\nTarget: %s\nOpenRung commit: %s\n' \
            '${{ matrix.target }}' "$OPENRUNG_COMMIT" > dist/BUILD-INFO.txt
          ls -lh dist

      - name: Verify package payloads and ABI
        run: |
          set -eux
          APK="$SDK_DIR/staging_dir/host/bin/apk"
          test -x "$APK"
          CLIENT_APK="$(find dist -maxdepth 1 -name 'openrung-client-*.apk' -print -quit)"
          LUCI_APK="$(find dist -maxdepth 1 -name 'luci-app-openrung-*.apk' -print -quit)"
          test -s "$CLIENT_APK" && test -s "$LUCI_APK"
          ROOT="$RUNNER_TEMP/apk-root"
          mkdir -p "$ROOT/client" "$ROOT/luci"
          "$APK" extract --allow-untrusted --no-chown --destination "$ROOT/client" "$CLIENT_APK"
          "$APK" extract --allow-untrusted --no-chown --destination "$ROOT/luci" "$LUCI_APK"
          test -s "$ROOT/client/usr/libexec/openrung-client.bin"
          test -s "$ROOT/client/etc/init.d/openrung"
          test -s "$ROOT/luci/usr/share/licenses/luci-app-openrung/LICENSE"
          file "$ROOT/client/usr/libexec/openrung-client.bin"
          readelf -h "$ROOT/client/usr/libexec/openrung-client.bin"
          echo "APK archive and package payload checks passed. Runtime testing on hardware/emulation is still required."

      - uses: actions/upload-artifact@v4
        with:
          name: openrung-openwrt-25.12-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  summary:
    if: always()
    needs: sdk
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        env:
          RESULT: ${{ needs.sdk.result }}
        run: |
          echo "OpenWrt 25.12 SDK APK matrix: $RESULT"
          echo "Artifacts are build/test outputs only; formal Release is not changed automatically."
          test "$RESULT" = success
