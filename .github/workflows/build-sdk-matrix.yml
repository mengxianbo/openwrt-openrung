name: Build installable OpenWrt SDK packages

on:
  workflow_dispatch:
    inputs:
      openrung_ref:
        description: OpenRung upstream ref
        required: true
        default: main
  push:
    paths:
      - '.github/workflows/build-sdk-matrix.yml'
      - 'package/openrung-client/**'
      - 'package/luci-app-openrung/**'
      - 'DISTRIBUTION-NOTICE-ADDENDUM.md'
      - 'COPYRIGHT.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths:
      - '.github/workflows/build-sdk-matrix.yml'
      - 'package/openrung-client/**'
      - 'package/luci-app-openrung/**'
      - 'DISTRIBUTION-NOTICE-ADDENDUM.md'
      - 'COPYRIGHT.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

jobs:
  sdk:
    name: OpenWrt 25.12 APK - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-armsr-armv8
            target: armsr/armv8
            sdk: openwrt-sdk-25.12.6-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sha: cbf3343bc3d6dc6180fc84077b966c13596a79904adaadbfe68409d563b0b596
            goarch: arm64
          - name: armv7-armsr-armv7
            target: armsr/armv7
            sdk: openwrt-sdk-25.12.6-armsr-armv7_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            sha: b29c5b96d757c3518a4f4df18e3187e16de618381625847b8874461935358179
            goarch: arm
            goarm: '7'
          - name: mipsel-ramips-mt7621
            target: ramips/mt7621
            sdk: openwrt-sdk-25.12.6-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sha: e4e3f25962ddf3ed55207fed456ecd1d6e55f3482c976b3183a640df6ef0adf0
            goarch: mipsle
            gomips: softfloat

    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget zstd

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Download and verify target SDK
        env:
          TARGET: ${{ matrix.target }}
          SDK_FILE: ${{ matrix.sdk }}
          SDK_SHA: ${{ matrix.sha }}
        run: |
          set -eux
          URL="https://downloads.openwrt.org/releases/25.12.6/targets/$TARGET/$SDK_FILE"
          wget -q "$URL" -O "/tmp/$SDK_FILE"
          echo "$SDK_SHA  /tmp/$SDK_FILE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sdk"
          tar --zstd -xf "/tmp/$SDK_FILE" -C "$RUNNER_TEMP/sdk" --strip-components=1
          echo "SDK_DIR=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"

      - name: Build OpenRung binary for SDK target
        env:
          INPUT_REF: ${{ inputs.openrung_ref }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
          GOMIPS: ${{ matrix.gomips || '' }}
        run: |
          set -eux
          REF="${INPUT_REF:-main}"
          git clone --filter=blob:none https://github.com/openrung/openrung.git upstream
          git -C upstream fetch --depth 1 origin "$REF"
          git -C upstream checkout --detach FETCH_HEAD
          echo "OPENRUNG_COMMIT=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"
          cd upstream
          go mod vendor
          test -s vendor/modules.txt
          LICENSE_DIR="$GITHUB_WORKSPACE/third-party-licenses"
          mkdir -p "$LICENSE_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          vendor = Path("vendor")
          destination = Path("third-party-licenses")
          count = 0
          for source in vendor.rglob("*"):
              if not source.is_file():
                  continue
              name = source.name.lower()
              if name.startswith(("license", "copying", "notice")):
                  target = destination / source.relative_to(vendor)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  count += 1
          if count == 0:
              raise SystemExit("No vendored license/notice files found")
          print(f"Collected {count} license/notice files")
          PY
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" GOARM="$GOARM" GOMIPS="$GOMIPS" \
            go build -mod=vendor -trimpath -tags 'with_utls,with_external_windivert' \
            -ldflags='-s -w' -o ../openrung-client.bin ./cmd/client
          file ../openrung-client.bin
          test -s ../openrung-client.bin

      - name: Build installable APKs with OpenWrt SDK
        run: |
          set -eux
          SDK="$SDK_DIR"
          mkdir -p "$SDK/package/openrung-client/files"
          cp package/openrung-client/openrung-client-wrapper \
            package/openrung-client/openrung.config package/openrung-client/openrung.init \
            "$SDK/package/openrung-client/files/"
          cp openrung-client.bin "$SDK/package/openrung-client/files/openrung-client.bin"
          cp upstream/LICENSE upstream/THIRD_PARTY_NOTICES.md \
            "$SDK/package/openrung-client/files/"
          cp COPYRIGHT.md "$SDK/package/openrung-client/files/COPYRIGHT.md"
          mkdir -p "$SDK/package/openrung-client/files/licenses/third-party"
          cp -a third-party-licenses/. "$SDK/package/openrung-client/files/licenses/third-party/"
          cp package/openrung-client/Makefile "$SDK/package/openrung-client/Makefile"
          cp -a package/luci-app-openrung "$SDK/package/"
          cp LICENSE COPYRIGHT.md DISTRIBUTION-NOTICE-ADDENDUM.md "$SDK/"
          cd "$SDK"
          make defconfig
          grep -q '^CONFIG_USE_APK=y' .config
          make package/openrung-client/compile package/luci-app-openrung/compile -j"$(nproc)" V=s
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin/packages -type f \( -name 'openrung-client*.apk' -o -name 'luci-app-openrung*.apk' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;
          cd "$GITHUB_WORKSPACE"
          CLIENT="$(find dist -maxdepth 1 -name 'openrung-client*.apk' -print -quit)"
          LUCI="$(find dist -maxdepth 1 -name 'luci-app-openrung*.apk' -print -quit)"
          test -n "$CLIENT" && test -n "$LUCI"
          mv "$CLIENT" "dist/openrung-client-${{ matrix.name }}.apk"
          mv "$LUCI" "dist/luci-app-openrung-${{ matrix.name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          printf 'OpenWrt 25.12.6 SDK target: %s\nOpenRung commit: %s\n' \
            '${{ matrix.target }}' "$OPENRUNG_COMMIT" > dist/BUILD-INFO.txt
          ls -lh dist

      - name: Verify APK archives and metadata
        run: |
          set -eux
          APK="$SDK_DIR/staging_dir/host/bin/apk"
          test -x "$APK"
          CLIENT_APK="$(find dist -maxdepth 1 -name 'openrung-client-*.apk' -print -quit)"
          LUCI_APK="$(find dist -maxdepth 1 -name 'luci-app-openrung-*.apk' -print -quit)"
          test -s "$CLIENT_APK"
          test -s "$LUCI_APK"

          # Extract with apk-tools v3: this validates the ADB/APKv3 container
          # and reads payloads without dependency resolution or package installation.
          ROOT="$RUNNER_TEMP/apk-root"
          mkdir -p "$ROOT/client" "$ROOT/luci"
          "$APK" extract --allow-untrusted --no-chown --destination "$ROOT/client" "$CLIENT_APK"
          "$APK" extract --allow-untrusted --no-chown --destination "$ROOT/luci" "$LUCI_APK"

          test -s "$ROOT/client/usr/libexec/openrung-client.bin"
          test -s "$ROOT/luci/usr/share/licenses/luci-app-openrung/LICENSE"
          echo "Both OpenWrt APKv3 packages were parsed and their payloads verified."

      - uses: actions/upload-artifact@v4
        with:
          name: openrung-openwrt-25.12-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  summary:
    if: always()
    needs: sdk
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        env:
          RESULT: ${{ needs.sdk.result }}
        run: |
          echo "OpenWrt SDK APK matrix: $RESULT"
          echo "Artifacts only; the existing formal Release is not changed."
          test "$RESULT" = success
