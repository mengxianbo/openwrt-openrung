name: Restore original x86_64 IPK assets to legacy Release (one-time)

on:
  push:
    branches:
      - feat/multi-arch-openwrt-packages
    paths:
      - '.github/workflows/restore-original-x86-ipk.yml'

permissions:
  actions: read
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Download the last successful main-branch IPK artifact before the feature build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p restore
          gh run download 46136876423 --repo "$GITHUB_REPOSITORY" \
            --pattern openrung-openwrt-ipk --dir restore
          CLIENT="$(find restore -type f -name openrung-client_x86_64.ipk -print -quit)"
          LUCI="$(find restore -type f -name luci-app-openrung_all.ipk -print -quit)"
          SUMS="$(find restore -type f -name IPK-SHA256SUMS -print -quit)"
          ZIP="$(find restore -type f -name openrung-ipk.zip -print -quit)"
          test -s "$CLIENT" && test -s "$LUCI" && test -s "$SUMS" && test -s "$ZIP"
          ROOT="$(dirname "$CLIENT")"
          (cd "$ROOT" && sha256sum -c IPK-SHA256SUMS)
          echo "RESTORE_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Restore only the four original x86_64 IPK Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ env.RESTORE_ROOT }}
        run: |
          set -euo pipefail
          gh release upload openwrt-packages \
            "$ROOT/openrung-client_x86_64.ipk" \
            "$ROOT/luci-app-openrung_all.ipk" \
            "$ROOT/IPK-SHA256SUMS" \
            "$ROOT/openrung-ipk.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Restored original x86_64 IPK, LuCI IPK, checksum manifest and ZIP bundle."

      - name: Verify restored Release asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ env.RESTORE_ROOT }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/openwrt-packages" > release.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          release = json.loads(Path("release.json").read_text())
          assets = {a["name"]: a for a in release["assets"]}
          names = [
              "openrung-client_x86_64.ipk",
              "luci-app-openrung_all.ipk",
              "IPK-SHA256SUMS",
              "openrung-ipk.zip",
          ]
          for name in names:
              digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
              actual = assets[name].get("digest", "")
              if actual != "sha256:" + digest:
                  raise SystemExit(f"Release digest mismatch for {name}: {actual} != sha256:{digest}")
              print(f"PASS: restored {name} ({digest})")
          PY
