      - name: Diagnose missing dependency licenses
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Go replace directives ====="
          grep -n -A40 '^replace' go.mod || true

          echo
          echo "===== Upstream third-party license declarations ====="
          grep -n -i -A8 -B3 \
            -E 'sing-box|sing-tun|sing-anytls|sing-mux|sing-shadowsocks|sing-vmess|fswatch' \
            THIRD_PARTY_NOTICES.md || true

          echo
          echo "===== Project license header ====="
          head -n 35 LICENSE
