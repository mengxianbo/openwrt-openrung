name: OpenRung License Compliance

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful historical Build #24 run ID"
        required: true
        type: string
      source_run_id:
        description: "Run ID of OpenRung #24 Corresponding Source workflow artifact"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify-distribution:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download original #24 IPK artifact (read-only)
        uses: actions/download-artifact@v4
        with:
          name: openrung-openwrt-ipk
          path: artifacts/ipk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Download separate #24 corresponding-source artifact
        uses: actions/download-artifact@v4
        with:
          name: openrung-build-24-corresponding-source
          path: artifacts/source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Audit historical IPKs without requiring metadata that #24 never contained
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, pathlib, tarfile

          root = pathlib.Path("artifacts/ipk")
          ipks = sorted(root.rglob("*.ipk"))
          if not ipks:
              raise SystemExit("FAIL: no IPK packages found in the selected historical build artifact")

          def data_files(ipk):
              with tarfile.open(ipk, "r:gz") as outer:
                  member = outer.extractfile("./data.tar.gz") or outer.extractfile("data.tar.gz")
                  if member is None:
                      raise SystemExit(f"FAIL: {ipk.name}: missing data.tar.gz")
                  payload = member.read()
              with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as inner:
                  result = {}
                  for item in inner.getmembers():
                      if item.isfile():
                          stream = inner.extractfile(item)
                          if stream:
                              result[item.name.lstrip("./")] = stream.read()
                  return result

          client_seen = luci_seen = False
          for ipk in ipks:
              files = data_files(ipk)
              if "usr/share/openrung/LICENSE" in files:
                  client_seen = True
                  if not files["usr/share/openrung/LICENSE"].strip():
                      raise SystemExit(f"FAIL: {ipk.name}: empty upstream LICENSE")
                  license_text = files["usr/share/openrung/LICENSE"].decode("utf-8", "replace")
                  if "GNU GENERAL PUBLIC LICENSE" not in license_text:
                      raise SystemExit(f"FAIL: {ipk.name}: upstream license text not recognized")
                  notices = files.get("usr/share/openrung/THIRD_PARTY_NOTICES.md", b"")
                  if not notices.strip():
                      raise SystemExit(f"FAIL: {ipk.name}: third-party notices missing/empty")
                  if b"sing-box" not in notices.lower():
                      raise SystemExit(f"FAIL: {ipk.name}: sing-box attribution missing")
                  print(f"PASS: {ipk.name}: embedded upstream license and third-party notices present")
              if "usr/share/licenses/luci-app-openrung/LICENSE" in files:
                  luci_seen = True
                  license_text = files["usr/share/licenses/luci-app-openrung/LICENSE"].decode("utf-8", "replace")
                  if "GNU GENERAL PUBLIC LICENSE" not in license_text:
                      raise SystemExit(f"FAIL: {ipk.name}: LuCI license text not recognized")
                  print(f"PASS: {ipk.name}: LuCI license present")

          if not client_seen:
              raise SystemExit("FAIL: client IPK with upstream license not found")
          if not luci_seen:
              raise SystemExit("FAIL: LuCI IPK with license not found")
          print("PASS: historical #24 IPK license checks completed; SOURCE-INFO.txt is audited via the separate exact-source manifest, not retroactively required inside this immutable IPK.")
          PY

      - name: Verify exact #24 corresponding source archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/source
          PACKAGING_COMMIT="ea2385243c93440fcede94923a7f83477d27af70"
          UPSTREAM_COMMIT="5cba4f0b9da642dcc9cc1904f861eb1d59c23a04"

          test -s "openwrt-openrung-packaging-source-${PACKAGING_COMMIT}.tar.gz"
          test -s "openrung-upstream-source-${UPSTREAM_COMMIT}-with-vendor.tar.gz"
          test -s OPENRUNG-UPSTREAM-LICENSE
          test -s OPENRUNG-THIRD-PARTY-NOTICES.md
          test -s LICENSES.md
          test -s SOURCE-DISTRIBUTION.md
          test -s SOURCE-MANIFEST.txt
          test -s SHA256SUMS-SOURCE
          test -s SHA256SUMS-SOURCE.sha256

          grep -q "Historical Actions run: 44885434847" SOURCE-MANIFEST.txt
          grep -q "Packaging commit: ${PACKAGING_COMMIT}" SOURCE-MANIFEST.txt
          grep -q "Upstream commit: ${UPSTREAM_COMMIT}" SOURCE-MANIFEST.txt
          grep -q "${PACKAGING_COMMIT}" SOURCE-DISTRIBUTION.md
          grep -q "${UPSTREAM_COMMIT}" SOURCE-DISTRIBUTION.md

          sha256sum -c SHA256SUMS-SOURCE
          sha256sum -c SHA256SUMS-SOURCE.sha256
          tar -tzf "openwrt-openrung-packaging-source-${PACKAGING_COMMIT}.tar.gz" >/dev/null
          tar -tzf "openrung-upstream-source-${UPSTREAM_COMMIT}-with-vendor.tar.gz" >/dev/null
          tar -xOf "openrung-upstream-source-${UPSTREAM_COMMIT}-with-vendor.tar.gz" ./vendor/modules.txt >/dev/null
          echo "PASS: exact #24 packaging and upstream corresponding-source archives verified."

      - name: Verify repository license scope documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE
          grep -q "GPL-3.0-or-later" README.md
          grep -q "GPL-3.0-or-later" LICENSES.md
          grep -q "go.mod" LICENSES.md
          grep -q "go.sum" LICENSES.md
          echo "PASS: repository license scope and dependency source-disclosure documentation are present."
